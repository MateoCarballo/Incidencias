version: '3.8'

services:
  # 1. Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: incidencias_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: incidencias_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Gestor de Archivos (MinIO - Alternativa a AWS S3)
  minio:
    image: minio/minio:latest
    container_name: incidencias_storage
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web UI Port
    volumes:
      - minio_data:/data

  # 3. La API Backend (Ejemplo si usamos Python/FastAPI o Spring Boot)
  # Este contenedor se construirá a partir del código de tu API cuando la creemos.
  # api:
  #   build: ./api  # Carpeta donde estaría el Dockerfile de la API
  #   container_name: incidencias_api
  #   restart: always
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - DB_HOST=postgres
  #     - DB_USER=admin
  #     - DB_PASS=secretpassword
  #     - MINIO_ENDPOINT=minio:9000
  #   depends_on:
  #     - postgres
  #     - minio

volumes:
  postgres_data:
  minio_data:
